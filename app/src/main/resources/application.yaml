server:
  port: 8080

spring:
  # Application
  application:
    name: NinSite

  # Datasource
  datasource:
    url: jdbc:postgresql://localhost:5431/NiN
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # Liquibase
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    enabled: true
    user: postgres
    password: postgres

  # Hibernate
  jpa:
    hibernate.ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true

  # Media config
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB

# Logging
logging:
  level:
    org.springframework.security: DEBUG

# Identity token security
jwt:
  secret: "dev-secret-change-measdasdddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111"

security:
  refresh:
    ttl-days: 14
    bytes: 64
    pepper: "CHANGE_ME_LONG_RANDOM"

# Media config
media:
  storage:
    local:
      root: ./storage/media
  limits:
    max-size-bytes: 104857600