server:
  port: 8080

spring:
  # Application
  application:
    name: NinSite

  # Datasource
  datasource:
    url: jdbc:postgresql://localhost:5431/NiN
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Liquibase
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    enabled: true
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # Hibernate
  jpa:
    hibernate.ddl-auto: validate
    show-sql: ${HIBERNATE_SHOW_SQL:false}
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: nikchemno.nesmachno@gmail.com
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.debug: ${MAIL_DEBUG:false}
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: http://localhost:8080/login/oauth2/code/google
            scope: [openid, profile, email]
            authorization-grant-type: authorization_code
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
#          github:
#            redirect-uri: http://localhost:8080/login/oauth2/code/github
#            client-id: ${GITHUB_CLIENT_ID}
#            client-secret: ${GITHUB_CLIENT_SECRET}
#            scope: read:user, user:email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
#          github:
#            authorization-uri: https://github.com/login/oauth/authorize
#            token-uri: https://github.com/login/oauth/access_token
#            user-info-uri: https://api.github.com/user
#            user-name-attribute: id
  # Media config
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB

# Logging
logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    ua.nin: ${APP_LOG_LEVEL:INFO}
    org.eclipse.angus.mail: ${MAIL_LOG_LEVEL:INFO}
    org.springframework.mail: ${MAIL_LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
    org.springframework.web: ${WEB_LOG_LEVEL:INFO}
    org.springframework.web.servlet: ${WEB_LOG_LEVEL:INFO}

app:
  mail:
    from: "NiN <nikchemno.nesmachno@gmail.com>"
  public-base-url: "http://localhost:8080"

# Identity token security
jwt:
  secret: ${JWT_SECRET}
  secret-base64: ${JWT_SECRET_BASE64:false}
  issuer: ${JWT_ISSUER:NiN}
  access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES}

security:
  refresh:
    ttl-days: 14
    secure: false
  ott:
    bytes: 32
    pepper: ${OTT_PEPPER}
  email-verify:
    ttl-minutes: 30
  password-reset:
    ttl-minutes: 30

# Media config
media:
  storage:
    local:
      root: ./storage/media
  limits:
    max-size-bytes: 104857600