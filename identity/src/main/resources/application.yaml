spring:
  # Application
  application:
    name: Identity
  server:
    port: 8080

  # Datasource
  datasource:
    url: jdbc:postgresql://localhost:5431/NiN
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # Liquibase
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    user: postgres
    password: postgres

  # Hibernate
  jpa:
    hibernate.ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true

