# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
#  repository: user
  springBootModuleName: app
  springBootJarName: app.jar
  dockerRepoName: bucketblueberry/nin-backend

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
        
    # Add permissions to allow the GITHUB_TOKEN to write Check Runs
    permissions:
      checks: write
      contents: write

    outputs:
      GITHUB_SHA_SHORT: ${{ steps.set-outputs.outputs.GITHUB_SHA_SHORT }}

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
        lfs: true
        
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache SonarQube packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build with Maven

      if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        #SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_USER }}
        PR_KEY: ${{ github.event.pull_request.number }}
        PR_BRANCH: ${{ github.head_ref }}
        PR_BASE: ${{ github.base_ref }}

      run: mvn clean org.jacoco:jacoco-maven-plugin:prepare-agent install

    - name: Test Reporter
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Tests Report
        path: |
          **/target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-empty: false

    - name: Rename user jar to app
      run: mv $springBootModuleName/target/*.jar $springBootModuleName/target/$springBootJarName

    - name: Set outputs
      id: set-outputs
      run: echo "GITHUB_SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@v5
      with:
        ignore-maven-wrapper: true
        directory: .
        maven-args: -DskipTests

  docker-build:
    runs-on: ubuntu-latest

    permissions:
      checks: write
      contents: write

    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.dockerRepoName }}:test-${{ needs.build.outputs.GITHUB_SHA_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    runs-on: ubuntu-latest

    permissions:
      checks: write
      contents: write

    needs: docker-build
    steps:
      - uses: actions/checkout@v5

      - name: Deploy 🚀
        if: ${{ github.event_name == 'push' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: 'gh-pages'
          folder: '.'
          clean: true
