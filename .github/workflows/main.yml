# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  repository: user
  userRepoName: app
  onbootJarName: app.jar
  dockerRepoName: ---

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
        
    # Add permissions to allow the GITHUB_TOKEN to write Check Runs
    permissions:
      checks: write
      contents: write

    outputs:
      GITHUB_SHA_SHORT: ${{ steps.set-outputs.outputs.GITHUB_SHA_SHORT }}

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
        lfs: true
        
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn clean install

    - name: Test Reporter
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Tests Report
        path: ${{ env.userRepoName }}/target/surefire-reports/*.xml
        reporter: java-junit

    - name: Rename user jar to app
      run: mv $userRepoName/target/*.jar $userRepoName/target/$onbootJarName

    - name: Set outputs
      id: set-outputs
      run: echo "GITHUB_SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
      
  docker-build:
    runs-on: ubuntu-latest

    permissions:
      checks: write
      contents: write

    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.dockerRepoName }}:test-${{ needs.build.outputs.GITHUB_SHA_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    runs-on: ubuntu-latest

    permissions:
      checks: write
      contents: write

    needs: docker-build
    steps:
      - uses: actions/checkout@v5

      - name: Deploy 🚀
        if: ${{ github.event_name == 'push' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: 'gh-pages'
          folder: '.'
          clean: true
