name: Qodana

on:
  workflow_call: {}

jobs:
  qodana:
    runs-on: ubuntu-latest
#    runs-on: self-hosted

    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@42dad391966aca8ca344ca2340a7f43a5507e9b2 # v2025.3.1
        with:
          pr-mode: ${{ github.event_name == 'pull_request' }}
          upload-result: true
          use-caches: true
          cache-default-branch-only: true
          primary-cache-key: qodana-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          additional-cache-key: qodana-${{ runner.os }}
          cache-dir: ${{ runner.temp }}/qodana/caches
          args: --baseline,qodana.sarif.json
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1016867356 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'