name: Build & Test & Sonar

on:
  workflow_call:
    inputs:
      springBootModuleName:
        required: true
        type: string
      springBootJarName:
        required: true
        type: string
    outputs:
      sha_short:
        description: "Short SHA for tags/artifacts"
        value: ${{ jobs.build.outputs.sha_short }}

jobs:
  build:
    runs-on: self-hosted
#    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: write

    outputs:
      sha_short: ${{ steps.set_sha.outputs.sha_short }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache SonarQube packages
        if: ${{ !contains(runner.labels, 'self-hosted') }}
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        if: ${{ !contains(runner.labels, 'self-hosted') }}
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Maven build & Tests & Sonar analysis.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_KEY: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          echo "--- Starting Unified Build and Sonar Analysis ---"

          SONAR_CMD="mvn -B -DskipTests=false org.sonarsource.scanner.maven:sonar-maven-plugin:sonar"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "--- Adding Pull Request parameters for Sonar Analysis ---"
            SONAR_CMD="$SONAR_CMD -Dsonar.pullrequest.key=$PR_KEY -Dsonar.pullrequest.branch=$PR_BRANCH -Dsonar.pullrequest.base=$PR_BASE"
          else
            BRANCH_NAME=$(echo ${{ github.ref }} | sed 's/refs\/heads\///')
            echo "--- Running standard Branch Analysis for Sonar on branch $BRANCH_NAME ---"
            SONAR_CMD="$SONAR_CMD -Dsonar.branch.name=$BRANCH_NAME"
          fi
          eval "$SONAR_CMD"

      - name: Test Reporter
        uses: dorny/test-reporter@3d76b34a4535afbd0600d347b09a6ee5deb3ed7f # v2.6.0
        if: success() || failure()
        with:
          name: Tests Report
          path: |
            **/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-empty: false

      - name: Rename user jar to app
        run: mv ${{ inputs.springBootModuleName }}/target/*.jar ${{ inputs.springBootModuleName }}/target/${{ inputs.springBootJarName }}

      - name: Upload app jar artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: app-jar
          path: ${{ inputs.springBootModuleName }}/target/${{ inputs.springBootJarName }}
          if-no-files-found: error

      - name: Set sha_short output
        id: set_sha
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8 # v5.0.0
        with:
          ignore-maven-wrapper: true
          directory: .
          maven-args: -DskipTests